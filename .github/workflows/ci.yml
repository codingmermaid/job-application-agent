name: tests and evals

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Unit tests (no API key needed; every LLM call is scripted)
        run: pytest -q
      - name: Offline evals (fail the build if the guardrails get worse)
        run: python evals/run_offline.py --min-recall 0.75 --max-false-alarms 0
